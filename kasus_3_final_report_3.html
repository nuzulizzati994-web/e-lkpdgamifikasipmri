      array.forEach((item) => {
        const check = item.some((key) => {
          if (typeof key === "object") {
            let checker = false;
            key.forEach((value) => {
              if (lowerAns.includes(value)) checker = true;

                return;

            });
            return checker;
          } else {
            return lowerAns.includes(key);
          }
        });
        if (check) acc += point;
      });
